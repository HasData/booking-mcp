[project]
name = "hasdata-booking-mcp"
version = "1.0.0"
description = "MCP server for Booking.com through HasData's hosted API. No Booking.com account."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "booking", "booking-com", "hotels", "travel", "model-context-protocol", "hasdata"]
# mcp is pinned below 2 because mcp-proxy 0.12.0 imports request_ctx, removed in the mcp 2.x SDK.
dependencies = ["mcp-proxy>=0.12.0", "mcp>=1.17,<2"]

[project.urls]
Homepage = "https://hasdata.com/apis/booking-api"
Repository = "https://github.com/HasData/booking-mcp"

[project.scripts]
hasdata-booking-mcp = "hasdata_booking_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hasdata_booking_mcp"]
